# Override GCE /etc/sysctl.d/60-gce-network-security.conf (net.ipv4.ip_forward = 0)
# at early boot so docker.service sees ip_forward=1 and does not set iptables -P FORWARD DROP,
# and override systemd 257+ /usr/lib/sysctl.d/50-default.conf (net.ipv4.conf.*.rp_filter = 2)
# for Cuttlefish interfaces while leaving host interfaces (e.g. ens4) untouched.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv4.conf.cvd-*.ignore_routes_with_linkdown = 0
net.ipv4.conf.cvd-*.rp_filter = 1
net.ipv6.conf.cvd-*.accept_dad = 0
